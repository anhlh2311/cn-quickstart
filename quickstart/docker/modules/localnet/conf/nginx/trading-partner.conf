server {
  listen ${TRADING_PARTNER_UI_PORT};
  server_name ans.localhost;
  location /api/validator {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:1${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }
  location / {
    proxy_pass http://ans-web-ui-trading-partner:8080/;
  }
}

# Deprecated, use json-ledger-api.localhost instead
server {
  listen ${TRADING_PARTNER_UI_PORT};
  server_name canton.localhost;
  location / {
    proxy_pass http://canton:1${PARTICIPANT_JSON_API_PORT_SUFFIX};
    include /etc/nginx/includes/cors-headers.conf;
  }
}

server {
  listen ${TRADING_PARTNER_UI_PORT};
  server_name json-ledger-api.localhost;
  location / {
    proxy_pass http://canton:1${PARTICIPANT_JSON_API_PORT_SUFFIX};
    include /etc/nginx/includes/cors-headers.conf;
  }
}

server {
  listen ${TRADING_PARTNER_UI_PORT} http2;
  server_name grpc-ledger-api.localhost;
  location / {
    grpc_pass grpc://canton:1${PARTICIPANT_LEDGER_API_PORT_SUFFIX};
  }
}

server {
  listen ${TRADING_PARTNER_UI_PORT};
  server_name localhost wallet.localhost;

  # Reverse proxy for /api/validator
  location /api/validator {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:1${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }

  # Reverse proxy to wallet-web-ui
  location / {
    proxy_pass http://wallet-web-ui-trading-partner:8080/;
  }
}
