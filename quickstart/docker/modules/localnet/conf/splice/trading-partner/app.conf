canton.validator-apps.tp-validator_backend = ${_validator_backend} {
  onboarding.secret = ${?TRADING_PARTNER_VALIDATOR_ONBOARDING_SECRET}
  domain-migration-dump-path = "/domain-upgrade-dump/domain_migration_dump-trading-partner.json"
  storage.config.properties.databaseName = validator-trading-partner
  admin-api.port = 1${VALIDATOR_ADMIN_API_PORT_SUFFIX}
  participant-client {
    admin-api.port = 1${PARTICIPANT_ADMIN_API_PORT_SUFFIX}
    ledger-api.client-config.port = 1${PARTICIPANT_LEDGER_API_PORT_SUFFIX}
  }
  validator-party-hint = ${TRADING_PARTNER_PARTY_HINT}

  domains.global.buy-extra-traffic {
    min-topup-interval = ${MIN_TRAFFIC_TOPUP_INTERVAL}
    target-throughput = ${TARGET_TRAFFIC_THROUGHPUT}
  }
}
